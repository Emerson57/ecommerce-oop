name: Secret Scan

on:
  push:
    branches: [ main, master, ESTABILIZACION_CRITICA ]
  pull_request:
    branches: [ main, master ]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run secret scan (bash)
        run: |
          chmod +x ./scripts/secret-scan.sh
          ./scripts/secret-scan.sh .

      - name: Run secret scan (PowerShell)
        if: runner.os == 'Windows'
        run: |
          pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass ./scripts/secret-scan.ps1 -Path .
